name: CI / CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-checks:
    name: Backend Linting & Quality Assurance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Black Code Formatter Check
        run: |
          black --check --line-length=120 backend/app/

      - name: Run isort Import Sorting Check
        run: |
          isort --check-only --profile black --line-length=120 backend/app/

      - name: Run Flake8 Linter
        run: |
          flake8 backend/app/ --max-line-length=120 --extend-ignore=E203,E501,W503,F401,F841

  frontend-checks:
    name: Frontend Build & Compilation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Production Bundle Build
        working-directory: frontend
        run: npm run build
